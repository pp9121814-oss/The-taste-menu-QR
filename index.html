<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Taste Restro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#17110d;
    color:#fff;
}

/* HEADER */

header{
    text-align:center;
    padding:45px 15px 30px;
    background:linear-gradient(135deg,#241710,#100c09);
    border-bottom:1px solid #b88a4a;
}

header h1{
    font-family:Georgia,serif;
    font-size:48px;
    color:#e6c17a;
}

header p{
    margin-top:8px;
    color:#bbb;
}

/* SEARCH */

.search-wrapper{
    max-width:700px;
    margin:25px auto 10px;
    padding:0 15px;
}

.search-box{
    position:relative;
}

.search-box span{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:20px;
}

#search{
    width:100%;
    padding:16px 50px;
    border-radius:30px;
    border:1px solid #a67b43;
    background:#211812;
    color:white;
    outline:none;
    font-size:16px;
}

#search::placeholder{
    color:#999;
}

/* CATEGORIES */

.categories{
    display:flex;
    gap:8px;
    max-width:1100px;
    margin:15px auto 25px;
    padding:0 15px;
    overflow-x:auto;
}

.categories button{
    flex-shrink:0;
    border:1px solid #795a35;
    background:#211812;
    color:#e7ca92;
    padding:9px 16px;
    border-radius:20px;
    cursor:pointer;
}

.categories button.active{
    background:#965441;
    color:white;
}

/* MENU */

.menu{
    max-width:1100px;
    margin:auto;
    padding:0 15px 180px;
}

.category-title{
    margin:30px 0 15px;
    text-align:center;
}

.category-title span{
    background:#8e4e40;
    padding:8px 24px;
    border-radius:5px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
}

.card{
    overflow:hidden;
    border:1px solid #554027;
    border-radius:14px;
    background:#211a15;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
}

.card-content{
    padding:14px;
}

.card h3{
    color:#efd59f;
    font-size:17px;
    min-height:40px;
}

.price{
    margin:7px 0 12px;
    font-size:17px;
    font-weight:bold;
}

.qty{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#120e0b;
    padding:6px;
    border-radius:8px;
}

.qty button{
    width:35px;
    height:35px;
    border:0;
    border-radius:7px;
    background:#965441;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.no-result{
    text-align:center;
    padding:60px 15px;
    color:#aaa;
}

/* CART */

.cart{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#100d0a;
    border-top:2px solid #b88a4a;
    z-index:999;
}

.cart-header{
    max-width:1100px;
    margin:auto;
    padding:13px 15px;
    display:flex;
    justify-content:space-between;
    cursor:pointer;
}

.cart-header h2{
    font-size:18px;
    color:#e6c17a;
}

.cart-body{
    max-width:1100px;
    margin:auto;
    padding:0 15px 15px;
    display:none;
}

.cart.open .cart-body{
    display:block;
}

.cart-items{
    max-height:220px;
    overflow:auto;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #30261d;
}

.table{
    margin-top:12px;
}

.table select{
    width:100%;
    padding:12px;
    border-radius:8px;
    background:#211812;
    color:white;
    border:1px solid #795a35;
}

.total{
    text-align:right;
    margin:12px 0;
    font-size:20px;
}

.order{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#25d366;
    color:white;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:38px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .card img{
        height:125px;
    }

    .card-content{
        padding:10px;
    }

    .card h3{
        font-size:14px;
    }

    .price{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>
    <h1>The Taste Restro</h1>
    <p>Fresh Food • Great Taste • Good Times</p>
</header>


<!-- SEARCH -->

<div class="search-wrapper">

    <div class="search-box">

        <span>🔎</span>

        <input
            id="search"
            type="search"
            autocomplete="off"
            placeholder="Search food... e.g. noodles, chicken, paneer"
        >

    </div>

</div>


<!-- CATEGORIES -->

<div class="categories" id="categories"></div>


<!-- MENU -->

<main class="menu" id="menu"></main>


<!-- CART -->

<div class="cart" id="cart">

    <div class="cart-header" onclick="toggleCart()">

        <h2>🛒 Your Order</h2>

        <span id="cartCount">0 items</span>

    </div>


    <div class="cart-body">

        <div class="cart-items" id="cartItems"></div>

        <div class="table">

            <select id="tableNumber">

                <option value="">Select Table Number</option>

                <option>Table 1</option>
                <option>Table 2</option>
                <option>Table 3</option>
                <option>Table 4</option>
                <option>Table 5</option>
                <option>Table 6</option>
                <option>Table 7</option>
                <option>Table 8</option>
                <option>Table 9</option>
                <option>Table 10</option>
                <option>Table 11</option>
                <option>Table 12</option>

            </select>

        </div>

        <div class="total">
            Total: ₹<b id="total">0</b>
        </div>

        <button class="order" onclick="placeOrder()">
            📲 Place Order on WhatsApp
        </button>

    </div>

</div>


<script>

/* =====================================================
   MENU DATA
   YAHAN TUMHARE EXACT MENU ITEMS AAYENGE
===================================================== */

const menu = [

    {
        category:"Noodles",
        items:[
            {
                name:"Veg Noodles",
                price:90,
                keywords:["noodles","veg","vegetarian"],
                image:"https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Veg Hakka Noodles",
                price:150,
                keywords:["noodles","hakka","veg"],
                image:"https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Veg Schezwan Noodles",
                price:160,
                keywords:["noodles","schezwan","veg"],
                image:"https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Veg Singapuri Noodles",
                price:170,
                keywords:["noodles","singapuri","veg"],
                image:"https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Egg Noodles",
                price:140,
                keywords:["noodles","egg"],
                image:"https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Chicken Noodles",
                price:180,
                keywords:["noodles","chicken"],
                image:"https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80"
            }
        ]
    },

    {
        category:"Momos",
        items:[
            {
                name:"Veg Momos",
                price:90,
                keywords:["momo","momos","veg"],
                image:"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Fried Momos",
                price:140,
                keywords:["momo","momos","fried"],
                image:"https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Chilli Momos",
                price:160,
                keywords:["momo","momos","chilli"],
                image:"https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?auto=format&fit=crop&w=700&q=80"
            }
        ]
    },

    {
        category:"Coffee",
        items:[
            {
                name:"Hot Coffee",
                price:70,
                keywords:["coffee","hot"],
                image:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Cold Coffee",
                price:110,
                keywords:["coffee","cold"],
                image:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=700&q=80"
            }
        ]
    },

    {
        category:"Tea",
        items:[
            {
                name:"Tea",
                price:30,
                keywords:["tea","chai"],
                image:"https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Black Tea",
                price:30,
                keywords:["tea","black","chai"],
                image:"https://images.unsplash.com/photo-1571934811356-5cc061b6821f?auto=format&fit=crop&w=700&q=80"
            },

            {
                name:"Lemon Tea",
                price:30,
                keywords:["tea","lemon","chai"],
                image:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=700&q=80"
            }
        ]
    }

];


/* =====================================================
   CART
===================================================== */

const cart = {};

let currentCategory = "All";


/* =====================================================
   NORMALIZE SEARCH
===================================================== */

function normalize(text){

    return text
        .toLowerCase()
        .replace(/[^a-z0-9 ]/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =====================================================
   SMART SEARCH
===================================================== */

function matches(item, category, query){

    if(!query) return true;

    const words = normalize(query).split(" ");

    const searchableText = normalize(
        item.name +
        " " +
        category +
        " " +
        (item.keywords || []).join(" ")
    );

    /*
       EVERY word must be present somewhere.
       
       "chicken noodles"
       -> chicken + noodles

       "noodles"
       -> every noodle item
    */

    return words.every(word =>
        searchableText.includes(word)
    );

}


/* =====================================================
   RENDER MENU
===================================================== */

function render(){

    const query =
        normalize(
            document.getElementById("search").value
        );

    const menuBox =
        document.getElementById("menu");

    menuBox.innerHTML="";

    let found=false;


    menu.forEach(section=>{

        /*
          Agar search hai to category filter ignore.
          Isse "noodles" search karne par
          saare noodles milenge.
        */

        if(
            !query &&
            currentCategory!=="All" &&
            currentCategory!==section.category
        ){
            return;
        }


        const filtered =
            section.items.filter(item =>
                matches(item,section.category,query)
            );


        if(filtered.length===0) return;


        found=true;


        const heading =
            document.createElement("div");

        heading.className="category-title";

        heading.innerHTML=
            `<span>${section.category}</span>`;

        menuBox.appendChild(heading);


        const grid =
            document.createElement("div");

        grid.className="grid";


        filtered.forEach(item=>{

            const quantity =
                cart[item.name]?.quantity || 0;


            const card =
                document.createElement("div");

            card.className="card";


            card.innerHTML=`

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="card-content">

                    <h3>${item.name}</h3>

                    <div class="price">
                        ₹${item.price}
                    </div>

                    <div class="qty">

                        <button
                            onclick="changeQuantity(
                                '${item.name.replace(/'/g,"\\'")}',
                                ${item.price},
                                -1
                            )">
                            −
                        </button>

                        <span>${quantity}</span>

                        <button
                            onclick="changeQuantity(
                                '${item.name.replace(/'/g,"\\'")}',
                                ${item.price},
                                1
                            )">
                            +
                        </button>

                    </div>

                </div>

            `;

            grid.appendChild(card);

        });


        menuBox.appendChild(grid);

    });


    if(!found){

        menuBox.innerHTML=`

            <div class="no-result">

                <div style="font-size:45px;">
                    🔍
                </div>

                <h2>No food found</h2>

                <p>
                    Try "noodles", "chicken",
                    "paneer", "momos" etc.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   CATEGORY BUTTONS
===================================================== */

function createCategories(){

    const box =
        document.getElementById("categories");

    box.innerHTML="";


    const all =
        document.createElement("button");

    all.innerText="All";
    all.className="active";

    all.onclick=()=>{

        currentCategory="All";

        document
            .querySelectorAll(".categories button")
            .forEach(b=>b.classList.remove("active"));

        all.classList.add("active");

        render();

    };

    box.appendChild(all);


    menu.forEach(section=>{

        const button =
            document.createElement("button");

        button.innerText=section.category;


        button.onclick=()=>{

            currentCategory=section.category;

            document
                .querySelectorAll(".categories button")
                .forEach(b=>b.classList.remove("active"));

            button.classList.add("active");

            document.getElementById("search").value="";

            render();

        };


        box.appendChild(button);

    });

}


/* =====================================================
   QUANTITY
===================================================== */

function changeQuantity(name,price,change){

    if(!cart[name]){

        cart[name]={
            price:price,
            quantity:0
        };

    }


    cart[name].quantity += change;


    if(cart[name].quantity<=0){

        delete cart[name];

    }


    render();
    updateCart();

}


/* =====================================================
   CART
===================================================== */

function updateCart(){

    const box =
        document.getElementById("cartItems");

    box.innerHTML="";


    let total=0;
    let count=0;


    Object.entries(cart).forEach(
        ([name,item])=>{

            const amount =
                item.price *
                item.quantity;

            total += amount;
            count += item.quantity;


            box.innerHTML += `

                <div class="cart-item">

                    <span>
                        ${name} × ${item.quantity}
                    </span>

                    <b>
                        ₹${amount}
                    </b>

                </div>

            `;

        }
    );


    if(count===0){

        box.innerHTML=
            `<p style="color:#888;padding:10px 0">
                Your cart is empty.
            </p>`;

    }


    document.getElementById("total")
        .innerText=total;

    document.getElementById("cartCount")
        .innerText=
            `${count} item${count===1?"":"s"}`;

}


/* =====================================================
   CART OPEN
===================================================== */

function toggleCart(){

    document
        .getElementById("cart")
        .classList.toggle("open");

}


/* =====================================================
   WHATSAPP ORDER
===================================================== */

function placeOrder(){

    const table =
        document.getElementById("tableNumber").value;


    if(Object.keys(cart).length===0){

        alert("Please select your food first.");

        return;

    }


    if(!table){

        alert("Please select your table number.");

        return;

    }


    let message =
`🍽️ THE TASTE RESTRO

🪑 Table: ${table}

ORDER:
`;


    let total=0;


    Object.entries(cart).forEach(
        ([name,item])=>{

            const amount =
                item.price *
                item.quantity;

            total += amount;

            message +=
`• ${name} × ${item.quantity} = ₹${amount}
`;

        }
    );


    message +=
`
💰 TOTAL: ₹${total}

Please prepare the order.`;


    const phone =
        "919520951715";


    const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);


    window.open(url,"_blank");

}


/* =====================================================
   SEARCH EVENT
===================================================== */

document
    .getElementById("search")
    .addEventListener("input",function(){

        /*
          Search ke waqt category selection
          automatically All ho jayega.
        */

        if(this.value.trim()){

            currentCategory="All";

            document
                .querySelectorAll(".categories button")
                .forEach(b=>b.classList.remove("active"));

            document
                .querySelector(".categories button")
                ?.classList.add("active");

        }

        render();

    });


/* START */

createCategories();
render();
updateCart();

</script>

</body>
</html>
