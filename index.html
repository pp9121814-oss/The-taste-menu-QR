<title>The Taste Restro | Digital Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#171717;
    color:#fff;
}

/* HEADER */
header{
    background:
    linear-gradient(rgba(30,20,10,.75),rgba(30,20,10,.8)),
    url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    padding:55px 20px;
    text-align:center;
    border-bottom:3px solid #b9935a;
}

header h1{
    font-family:Georgia,serif;
    font-size:52px;
    color:#f4dfb0;
    text-shadow:3px 3px 8px #000;
}

header p{
    color:#ddd;
    margin-top:10px;
    font-size:17px;
}

/* CONTROLS */
.controls{
    max-width:1200px;
    margin:25px auto;
    padding:0 18px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.controls input,
.controls select{
    flex:1;
    min-width:220px;
    padding:15px;
    border-radius:10px;
    border:1px solid #8c7042;
    background:#292929;
    color:white;
    outline:none;
    font-size:15px;
}

/* CATEGORY */
.category{
    max-width:1200px;
    margin:35px auto;
    padding:0 18px;
}

.category-title{
    text-align:center;
    margin-bottom:22px;
}

.category-title span{
    background:#8f4f42;
    padding:9px 25px;
    border-radius:5px;
    font-size:21px;
    font-weight:bold;
}

/* MENU GRID */
.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

/* ITEM CARD */
.card{
    background:linear-gradient(145deg,#292929,#1d1d1d);
    border:1px solid #5c482d;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 7px 20px rgba(0,0,0,.45);
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#b9935a;
}

.card img{
    width:100%;
    height:175px;
    object-fit:cover;
}

.card-body{
    padding:16px;
}

.card h3{
    color:#f1dfb5;
    font-size:18px;
    margin-bottom:8px;
}

.price{
    color:#fff;
    font-weight:bold;
    font-size:17px;
    margin-bottom:13px;
}

.qty{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#111;
    border-radius:10px;
    padding:7px;
}

.qty button{
    width:35px;
    height:35px;
    border:0;
    border-radius:8px;
    background:#9b5a46;
    color:white;
    font-size:21px;
    cursor:pointer;
}

.qty span{
    font-size:17px;
    font-weight:bold;
}

/* CART */
.cart{
    position:sticky;
    bottom:0;
    z-index:100;
    max-width:1200px;
    margin:40px auto 0;
    background:#111;
    border:1px solid #a67c43;
    border-radius:18px 18px 0 0;
    padding:22px;
    box-shadow:0 -5px 25px rgba(0,0,0,.6);
}

.cart h2{
    color:#f0d59e;
    margin-bottom:15px;
}

.cart-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid #333;
}

.total{
    text-align:right;
    font-size:23px;
    font-weight:bold;
    margin-top:15px;
    color:#f2d59c;
}

.order-btn{
    width:100%;
    margin-top:15px;
    padding:16px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.order-btn:hover{
    filter:brightness(1.08);
}

.empty{
    color:#888;
}

.hidden{
    display:none;
}

footer{
    text-align:center;
    padding:35px;
    color:#aaa;
}

/* MOBILE */
@media(max-width:600px){

    header{
        padding:40px 15px;
    }

    header h1{
        font-size:38px;
    }

    .menu-grid{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .card img{
        height:125px;
    }

    .card-body{
        padding:11px;
    }

    .card h3{
        font-size:15px;
    }

    .price{
        font-size:15px;
    }

    .qty button{
        width:31px;
        height:31px;
    }
}
</style>
</head>

/* =========================================
   CART
========================================= */

let cart={};

function allItems(){

    let arr=[];

    menuData.forEach(category=>{
        category.items.forEach(item=>{
            arr.push({
                name:item[0],
                price:item[1],
                image:item[2],
                category:category.cat
            });
        });
    });

    return arr;
}

const items=allItems();


/* =========================================
   RENDER MENU
========================================= */

function renderMenu(){

    const menu=document.getElementById("menu");

    const search=
        document.getElementById("search").value.toLowerCase();

    menu.innerHTML="";

    menuData.forEach(category=>{

        const filtered=category.items.filter(item =>
            item[0].toLowerCase().includes(search)
        );

        if(filtered.length===0) return;

        const section=document.createElement("section");

        section.className="category";

        section.innerHTML=`
            <div class="category-title">
                <span>${category.cat}</span>
            </div>

            <div class="menu-grid"></div>
        `;

        const grid=section.querySelector(".menu-grid");

        filtered.forEach(item=>{

            const key=item[0];

            const qty=cart[key] || 0;

            const card=document.createElement("div");

            card.className="card";

            card.innerHTML=`

                <img
                    src="${item[2]}"
                    alt="${item[0]}"
                    loading="lazy"
                >

                <div class="card-body">

                    <h3>${item[0]}</h3>

                    <div class="price">
                        ₹${item[1]}
                    </div>

                    <div class="qty">

                        <button onclick='changeQty(${JSON.stringify(key)},-1)'>
                            −
                        </button>

                        <span id="qty-${CSS.escape(key)}">
                            ${qty}
                        </span>

                        <button onclick='changeQty(${JSON.stringify(key)},1)'>
                            +
                        </button>

                    </div>

                </div>
            `;

            grid.appendChild(card);

        });

        menu.appendChild(section);

    });

}


/* =========================================
   QUANTITY
========================================= */

function changeQty(name,change){

    if(!cart[name]){
        cart[name]=0;
    }

    cart[name]+=change;

    if(cart[name]<0){
        cart[name]=0;
    }

    renderMenu();
    updateCart();

}


/* =========================================
   CART
========================================= */

function updateCart(){

    const box=document.getElementById("cartItems");

    box.innerHTML="";

    let total=0;
    let count=0;

    items.forEach(item=>{

        const qty=cart[item.name] || 0;

        if(qty>0){

            count+=qty;

            const itemTotal=item.price*qty;

            total+=itemTotal;

            const row=document.createElement("div");

            row.className="cart-row";

            row.innerHTML=`
                <span>
                    ${item.name} × ${qty}
                </span>

                <strong>
                    ₹${itemTotal}
                </strong>
            `;

            box.appendChild(row);

        }

    });


    if(count===0){

        box.innerHTML=
        `<p class="empty">No items selected.</p>`;

    }

    document.getElementById("total").innerText=total;

}


/* =========================================
   WHATSAPP ORDER
========================================= */

function placeOrder(){

    const table=document.getElementById("table").value;

    if(!table){

        alert("Please select your table number.");

        return;
    }


    let message=
        "🍽️ THE TASTE RESTRO - NEW ORDER\n\n";

    message+=
        "🪑 Table: "+table+"\n\n";


    let total=0;
    let hasOrder=false;


    items.forEach(item=>{

        const qty=cart[item.name] || 0;

        if(qty>0){

            hasOrder=true;

            const amount=item.price*qty;

            total+=amount;

            message+=
                "• "+item.name+
                " × "+qty+
                " = ₹"+amount+"\n";

        }

    });


    if(!hasOrder){

        alert("Please select at least one food item.");

        return;
    }


    message+=
        "\n💰 TOTAL: ₹"+total+
        "\n\nPlease prepare the order. 🙏";


    const phone="919520951715";


    const url=
        "https://wa.me/"+phone+
        "?text="+encodeURIComponent(message);


    window.open(url,"_blank");

}


/* START */
renderMenu();
updateCart();

</script>
