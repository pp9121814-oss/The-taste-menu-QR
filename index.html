<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>The Taste Restro</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#17110d;
  --bg2:#241912;
  --card:#2b2018;
  --cream:#f5eee2;
  --cream2:#e9dcc8;
  --gold:#c5a05a;
  --gold2:#dfc27e;
  --burgundy:#681d2a;
  --burgundy2:#842838;
  --text:#f3eadb;
  --muted:#aa9a85;
  --dark:#241914;
  --border:rgba(197,160,90,.28);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(197,160,90,.14),transparent 34%),
    radial-gradient(circle at 0% 50%,rgba(104,29,42,.12),transparent 30%),
    linear-gradient(135deg,#120d09,#211710 50%,#110c09);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.13;
  background-image:
    repeating-linear-gradient(
      8deg,
      transparent 0 7px,
      rgba(255,255,255,.025) 8px,
      transparent 9px
    );
}

.wrap{
  max-width:1120px;
  margin:auto;
  padding:0 18px;
}

/* HEADER */

header{
  margin:18px auto 0;
  max-width:1120px;
  padding:30px 22px 25px;
  border:1px solid rgba(197,160,90,.55);
  background:
    linear-gradient(145deg,#faf5ec,#eee2cf);
  position:relative;
  text-align:center;
  box-shadow:
    0 18px 45px rgba(0,0,0,.30),
    inset 0 0 0 5px rgba(197,160,90,.06);
}

header:before,
header:after{
  content:"";
  position:absolute;
  width:45px;
  height:45px;
  border-color:var(--gold);
}

header:before{
  left:11px;
  top:11px;
  border-left:1px solid;
  border-top:1px solid;
}

header:after{
  right:11px;
  bottom:11px;
  border-right:1px solid;
  border-bottom:1px solid;
}

.kicker{
  font-size:9px;
  letter-spacing:.48em;
  color:#8a6a34;
  margin-bottom:7px;
}

.logo{
  font:
    600 clamp(45px,7vw,78px)/.78
    "Cormorant Garamond",serif;
  letter-spacing:.015em;
  color:#641c27;
}

.sub{
  font-size:10px;
  letter-spacing:.60em;
  color:#641c27;
  margin-top:13px;
  padding-left:.60em;
  font-weight:600;
}

.rule{
  width:min(380px,80%);
  height:1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(197,160,90,.7),
      transparent
    );
  margin:20px auto 0;
  position:relative;
}

.rule span{
  position:absolute;
  left:50%;
  top:-7px;
  transform:translateX(-50%);
  background:#f2e8d8;
  padding:0 13px;
  color:#a47c35;
  font:500 10px Inter;
  letter-spacing:.15em;
}

/* SEARCH */

.searchbox{
  max-width:700px;
  margin:24px auto 0;
  position:relative;
}

.searchbox input{
  width:100%;
  padding:15px 48px 15px 18px;
  border-radius:4px;
  border:1px solid rgba(197,160,90,.35);
  outline:0;
  background:#f8f2e8;
  color:#241a15;
  font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);
  transition:.2s;
}

.searchbox input::placeholder{
  color:#8d8070;
}

.searchbox input:focus{
  border-color:var(--gold);
  box-shadow:
    0 0 0 3px rgba(197,160,90,.10),
    0 12px 30px rgba(0,0,0,.25);
}

.searchbox span{
  position:absolute;
  right:17px;
  top:50%;
  transform:translateY(-50%);
  color:#a47c35;
  font-size:19px;
}

/* CATEGORY NAV */

.nav{
  max-width:1120px;
  margin:15px auto 0;
  padding:0 18px;
  display:flex;
  gap:7px;
  overflow:auto;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  white-space:nowrap;
  background:linear-gradient(145deg,#f7f0e4,#e8dcc9);
  border:1px solid rgba(197,160,90,.35);
  color:#69584c;
  padding:9px 14px;
  border-radius:3px;
  font-size:10px;
  cursor:pointer;
  transition:.2s;
}

.nav button:hover{
  color:#fff;
  border-color:var(--burgundy);
  background:var(--burgundy);
  transform:translateY(-1px);
}

.nav button.active{
  color:#fff;
  border-color:var(--burgundy);
  background:
    linear-gradient(145deg,#792333,#5d1824);
  box-shadow:0 5px 16px rgba(104,29,42,.28);
}

/* MENU */

.menu{
  padding:10px 0 160px;
}

.section{
  margin:35px 0 0;
}

.section-title{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:12px;
}

.section-title h2{
  margin:0;
  color:var(--gold2);
  font:
    600 31px/1
    "Cormorant Garamond",serif;
  white-space:nowrap;
  text-shadow:0 2px 10px rgba(0,0,0,.25);
}

.section-title i{
  height:1px;
  background:
    linear-gradient(
      90deg,
      rgba(197,160,90,.55),
      rgba(197,160,90,.15),
      transparent
    );
  flex:1;
}

.section-title small{
  font-size:9px;
  color:#988875;
  letter-spacing:.17em;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px 13px;
}

.item{
  display:grid;
  grid-template-columns:74px 1fr auto;
  gap:12px;
  align-items:center;
  min-height:80px;
  padding:8px;
  border:1px solid rgba(197,160,90,.12);
  background:
    linear-gradient(
      120deg,
      rgba(52,39,28,.97),
      rgba(31,25,20,.97)
    );
  border-radius:3px;
  box-shadow:0 7px 20px rgba(0,0,0,.15);
  transition:.2s;
}

.item:hover{
  transform:translateY(-2px);
  border-color:rgba(197,160,90,.42);
  box-shadow:0 12px 25px rgba(0,0,0,.25);
}

.pic{
  width:74px;
  height:64px;
  object-fit:cover;
  border-radius:3px;
  border:1px solid rgba(197,160,90,.20);
  filter:saturate(.88) contrast(1.02);
  background:#382c22;
}

.name{
  font:
    600 21px/1.02
    "Cormorant Garamond",serif;
  color:#f1e7d7;
}

.cat{
  font-size:8px;
  color:#9c8c78;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-top:5px;
}

.price{
  font-size:14px;
  color:var(--gold2);
  white-space:nowrap;
  font-weight:600;
}

.actions{
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:6px;
  margin-top:6px;
}

.qty{
  display:flex;
  align-items:center;
  gap:3px;
}

.qty button{
  width:24px;
  height:24px;
  border:1px solid rgba(197,160,90,.32);
  background:#211711;
  color:var(--gold2);
  border-radius:2px;
  cursor:pointer;
  transition:.15s;
}

.qty button:hover{
  background:var(--gold);
  color:#211711;
}

.qty span{
  font-size:10px;
  min-width:15px;
  text-align:center;
  color:#ddd0bd;
}

.add{
  border:1px solid rgba(197,160,90,.35);
  background:rgba(104,29,42,.82);
  color:#fff;
  padding:6px 9px;
  border-radius:2px;
  font-size:9px;
  cursor:pointer;
  transition:.15s;
}

.add:hover{
  background:var(--burgundy2);
  border-color:var(--gold);
  transform:translateY(-1px);
}

/* VARIANTS */

.variants{
  grid-column:2/-1;
  display:flex;
  gap:6px;
  margin-top:-3px;
}

.variants button{
  background:#eee3d1;
  border:1px solid rgba(197,160,90,.35);
  color:#725e4e;
  padding:5px 9px;
  border-radius:2px;
  font-size:9px;
  cursor:pointer;
}

.variants button.active{
  color:#fff;
  border-color:var(--burgundy);
  background:var(--burgundy);
}

/* NO RESULT */

.noresult{
  text-align:center;
  padding:80px 10px;
  color:#9b8d7b;
}

.noresult b{
  display:block;
  font:
    600 38px
    "Cormorant Garamond",serif;
  color:var(--gold2);
  margin-bottom:6px;
}

/* CART */

.cart{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  width:min(700px,calc(100% - 24px));
  background:rgba(246,239,227,.98);
  border:1px solid rgba(197,160,90,.50);
  border-radius:4px;
  box-shadow:0 18px 60px rgba(0,0,0,.45);
}

.carthead{
  padding:13px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.carthead b{
  font-size:12px;
  color:#2a1e18;
}

.carthead span{
  color:#9d7835;
  font-size:13px;
}

.panel{
  display:none;
  border-top:1px solid rgba(197,160,90,.25);
  padding:12px;
}

.cart.open .panel{
  display:block;
}

.cartlist{
  max-height:210px;
  overflow:auto;
}

.crow{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid rgba(100,80,60,.12);
  font-size:11px;
  color:#3b2d24;
}

.crow strong{
  color:var(--burgundy);
}

.remove{
  border:0;
  background:none;
  color:#766b5f;
  cursor:pointer;
  font-size:16px;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.form input,
.form select{
  background:#fffaf2;
  border:1px solid #d8c7ae;
  color:#30241d;
  padding:10px;
  border-radius:2px;
  outline:0;
  font-size:12px;
}

.form input:focus,
.form select:focus{
  border-color:var(--gold);
}

.order{
  grid-column:1/-1;
  border:0;
  background:
    linear-gradient(135deg,#7b2332,#5e1825);
  color:#fff;
  padding:12px;
  font-weight:600;
  cursor:pointer;
  border-radius:2px;
  letter-spacing:.03em;
  box-shadow:0 7px 18px rgba(104,29,42,.25);
  transition:.2s;
}

.order:hover{
  background:
    linear-gradient(135deg,#8c2a3b,#6b1b29);
  transform:translateY(-1px);
}

/* TOAST */

.toast{
  position:fixed;
  z-index:30;
  bottom:94px;
  left:50%;
  transform:translateX(-50%);
  background:#6f1d2a;
  border:1px solid var(--gold);
  color:#fff;
  padding:10px 16px;
  font-size:10px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.toast.show{
  opacity:1;
}

/* MOBILE */

@media(max-width:700px){

  .wrap{
    padding:0 12px;
  }

  header{
    margin-top:10px;
    padding:25px 13px 20px;
  }

  .logo{
    font-size:52px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .item{
    grid-template-columns:68px 1fr auto;
  }

  .pic{
    width:68px;
    height:58px;
  }

  .name{
    font-size:20px;
  }

  .section-title h2{
    font-size:28px;
  }

  .form{
    grid-template-columns:1fr;
  }

  .order{
    grid-column:auto;
  }

  .nav{
    padding:0 12px;
  }
}
</style>
</head>

/* ================================
   ORDER SYSTEM
================================ */

const PHONE="919520951715";

let active="All";
let cart={};
let variants={};

const aliases={
 "Noodles Veg & Non Veg":"noodles",
 "Momos":"momo momos",
 "Maggi":"maggi noodles",
 "Veg Main Course":"paneer dal veg",
 "Non Veg Main Course":"chicken non veg",
 "Rice / Biryani":"rice biryani",
 "Burger / Sandwich":"burger sandwich",
 "Tawa Roti / Tandoor Roti":"roti naan",
 "Desert":"dessert ice cream",
 "Drinks":"drink soda lassi"
};

const norm=s =>
 String(s)
 .toLowerCase()
 .replace(/[^a-z0-9]+/g," ")
 .trim();

const slug=s =>
 norm(s).replace(/\s+/g,"-");

function allCats(){
 return [
   "All",
   ...MENU.map(x=>x.category)
 ];
}

function itemText(x){
 return norm(
   x.name+" "+
   x.category+" "+
   (aliases[x.category]||"")
 );
}

function match(x,q){

 if(!q)return true;

 return norm(q)
   .split(/\s+/)
   .every(
     w=>itemText(x).includes(w)
   );
}

function price(x){

 if(!x.variants)
   return x.price;

 let v=
   variants[slug(x.name)] ||
   Object.keys(x.variants)[0];

 return x.variants[v];
}

function variant(x){

 return variants[slug(x.name)] ||
   Object.keys(x.variants||{})[0];
}


/* NAV */

function renderNav(){

 nav.innerHTML="";

 allCats().forEach(c=>{

   let b=document.createElement("button");

   b.textContent=c;

   b.className=
     c===active
     ?"active"
     :"";

   b.onclick=()=>{

     active=c;

     search.value="";

     renderNav();

     render();

   };

   nav.appendChild(b);

 });

}


/* MENU */

function render(){

 let q=norm(search.value);

 let found=0;

 menu.innerHTML="";

 MENU.forEach(s=>{

   if(
     active!=="All" &&
     active!==s.category
   )return;

   let items=
     s.items.filter(
       x=>match(
         {...x,category:s.category},
         q
       )
     );

   if(!items.length)return;

   found+=items.length;

   let sec=
     document.createElement("section");

   sec.className="section";

   sec.innerHTML=`
     <div class="section-title">
       <h2>${s.category}</h2>
       <i></i>
       <small>
         ${items.length} ITEMS
       </small>
     </div>
   `;

   let grid=
     document.createElement("div");

   grid.className="grid";

   items.forEach(x=>{
     grid.appendChild(
       card(x,s.category)
     );
   });

   sec.appendChild(grid);

   menu.appendChild(sec);

 });

 if(!found){

   menu.innerHTML=`
     <div class="noresult">
       <b>No dish found</b>
       Try noodles, chicken,
       paneer, momos...
     </div>
   `;

 }

}


/* FOOD CARD */

function card(x,cat){

 let k=slug(x.name);

 let v=variant(x);

 let p=price(x);

 let key=
   x.variants
   ?x.name+" • "+v
   :x.name;

 let qty=
   cart[key]?.qty || 0;

 let el=
   document.createElement("article");

 el.className="item";

 el.innerHTML=`

   <img
     class="pic"
     src="${x.image}"
     alt="${x.name}"
     loading="lazy"
     referrerpolicy="no-referrer"
     onerror="this.style.visibility='hidden'"
   >

   <div>

     <div class="name">
       ${x.name}
     </div>

     <div class="cat">
       ${cat}
     </div>

     <div class="actions">

       <div class="qty">

         <button
           onclick='change(${JSON.stringify(key)},${p},-1)'>
           −
         </button>

         <span>
           ${qty}
         </span>

         <button
           onclick='change(${JSON.stringify(key)},${p},1)'>
           +
         </button>

       </div>

       <button
         class="add"
         onclick='change(${JSON.stringify(key)},${p},1)'>
         ADD
       </button>

     </div>

   </div>

   <div class="price">
     ₹${p}
   </div>

   ${
     x.variants
     ?
     `<div class="variants">
       ${
         Object.keys(x.variants)
         .map(z=>`
           <button
             class="${z===v?"active":""}"
             onclick='setVar(
               ${JSON.stringify(x.name)},
               ${JSON.stringify(z)}
             )'>
             ${z} ₹${x.variants[z]}
           </button>
         `)
         .join("")
       }
     </div>`
     :""
   }

 `;

 return el;
}


/* VARIANT */

function setVar(name,v){

 variants[slug(name)]=v;

 render();

}


/* ADD / REMOVE */

function change(k,p,d){

 if(!cart[k]){

   cart[k]={
     qty:0,
     price:p
   };

 }

 cart[k].qty+=d;

 if(cart[k].qty<=0)
   delete cart[k];

 update();

 render();

 toast.classList.add("show");

 setTimeout(
   ()=>toast.classList.remove("show"),
   800
 );

}


/* CART */

function update(){

 cartlist.innerHTML="";

 let total=0;

 let count=0;

 Object.entries(cart)
 .forEach(([k,x])=>{

   total+=
     x.qty*x.price;

   count+=x.qty;

   cartlist.innerHTML+=`

     <div class="crow">

       <div>

         ${k}

         <br>

         <small
           style="color:#71695f">
           Qty ${x.qty}
         </small>

       </div>

       <strong>
         ₹${x.qty*x.price}
       </strong>

       <button
         class="remove"
         onclick='del(${JSON.stringify(k)})'>
         ×
       </button>

     </div>

   `;

 });

 if(!count){

   cartlist.innerHTML=`
     <div
       style="
         color:#756d62;
         font-size:11px;
         padding:7px 0">
       Your order is empty.
     </div>
   `;

 }

 countEl.textContent=
   count+
   " item"+
   (count===1?"":"s");

 totalEl.textContent=total;

}


function del(k){

 delete cart[k];

 update();

 render();

}


function toggleCart(){

 cartEl.classList.toggle("open");

}


/* WHATSAPP */

function sendOrder(){

 let entries=
   Object.entries(cart);

 let table=
   document
   .getElementById("table")
   .value;

 let note=
   document
   .getElementById("note")
   .value
   .trim();

 if(!entries.length){

   alert(
     "Please add items first."
   );

   return;

 }

 if(!table){

   alert(
     "Please select your table number."
   );

   return;

 }

 let total=0;

 let msg=
   "THE TASTE RESTRO\n\n"+
   "TABLE: "+table+
   "\n\nORDER:\n";

 entries.forEach(
   ([k,x])=>{

     let a=
       x.qty*x.price;

     total+=a;

     msg+=
       "• "+
       k+
       " × "+
       x.qty+
       " = ₹"+
       a+
       "\n";

   }
 );

 msg+=
   "\nTOTAL: ₹"+
   total;

 if(note)
   msg+=
     "\nNOTE: "+
     note;

 window.open(
   "https://wa.me/"+
   PHONE+
   "?text="+
   encodeURIComponent(msg),
   "_blank"
 );

}


/* ELEMENTS */

const search=
 document.getElementById("search");

const nav=
 document.getElementById("nav");

const menu=
 document.getElementById("menu");

const cartEl=
 document.getElementById("cart");

const cartlist=
 document.getElementById("cartlist");

const countEl=
 document.getElementById("count");

const totalEl=
 document.getElementById("total");

const toast=
 document.getElementById("toast");


/* SEARCH */

search.addEventListener(
 "input",
 ()=>{
   active="All";
   renderNav();
   render();
 }
);


/* START */

renderNav();

render();

update();

</script>
