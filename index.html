<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Taste Restro - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --bg-dark: #0f0f11;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px 30px;
        }

        /* 1. ENTRY SCREEN (Intro Text Animation) */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeOutOverlay 0.8s ease 2.2s forwards;
            pointer-events: none;
        }

        .intro-text {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInText 1s ease 0.2s forwards;
        }

        @keyframes fadeInText {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOutOverlay {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* 2. MAIN MENU CONTENT */
        header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 12px;
            color: #a0a0a0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Menu Container */
        .menu-wrapper {
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .menu-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        /* 3. AESTHETIC FOOTER CREDITS */
        footer {
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }

        .credits {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.7);
            font-weight: 400;
        }

        .credits a {
            color: rgba(212, 175, 55, 0.9);
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="intro-overlay">
        <div class="intro-text">This is your menu</div>
    </div>

    <header>
        <h1>The Taste Restro</h1>
        <p class="subtitle">Digital Menu</p>
    </header>

    <div class="menu-wrapper">
        <div class="menu-card">
            <img src="menu1.jpg" alt="The Taste Restro Main Menu">
        </div>

        <div class="menu-card">
            <img src="menu2.jpg" alt="The Taste Restro Drinks and Snacks Menu">
        </div>
    </div>

    <footer>
        <p class="credits">Made by - Priyanshu &nbsp;|&nbsp; Contact: <a href="tel:9520951715">9520951715</a></p>
    </footer>

</body>
</html>
