<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17120e">
<title>The Taste Restro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
 --wood:#21170f;--wood2:#2b1d13;--ink:#141313;--paper:#eee2cb;
 --gold:#b8965c;--gold2:#d8bd86;--muted:#9d917e;--red:#713f35;
}
*{box-sizing:border-box}
body{
 margin:0;background:
 radial-gradient(circle at 15% 10%,rgba(184,150,92,.09),transparent 28%),
 linear-gradient(135deg,#17110d,#0d0d0c 48%,#18110d);
 color:var(--paper);font-family:Inter,Arial,sans-serif;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background-image:repeating-linear-gradient(8deg,transparent 0 7px,rgba(255,255,255,.025) 8px,transparent 9px);
}
.wrap{max-width:1120px;margin:auto;padding:0 18px}

/* compact physical-menu style header */
header{
 margin:18px auto 0;max-width:1120px;padding:25px 22px 20px;
 border:1px solid rgba(184,150,92,.5);
 background:linear-gradient(145deg,rgba(72,47,29,.82),rgba(25,18,13,.94));
 position:relative;text-align:center;
 box-shadow:inset 0 0 0 5px rgba(184,150,92,.08),0 16px 40px rgba(0,0,0,.35);
}
header:before,header:after{
 content:"";position:absolute;width:42px;height:42px;border-color:var(--gold);
}
header:before{left:10px;top:10px;border-left:1px solid;border-top:1px solid}
header:after{right:10px;bottom:10px;border-right:1px solid;border-bottom:1px solid}
.kicker{font-size:9px;letter-spacing:.45em;color:var(--gold2);margin-bottom:5px}
.logo{
 font:600 clamp(42px,7vw,76px)/.75 "Cormorant Garamond",serif;
 letter-spacing:.01em;color:#f1dfbd;text-shadow:0 2px 15px #000;
}
.sub{font-size:10px;letter-spacing:.55em;color:#bda47a;margin-top:10px;padding-left:.55em}
.rule{width:min(360px,80%);height:1px;background:rgba(184,150,92,.45);margin:17px auto 0;position:relative}
.rule span{position:absolute;left:50%;top:-7px;transform:translateX(-50%);background:#21170f;padding:0 11px;color:var(--gold);font:500 10px Inter}

/* search */
.searchbox{max-width:700px;margin:22px auto 0;position:relative}
.searchbox input{
 width:100%;padding:14px 45px 14px 17px;border-radius:5px;
 border:1px solid rgba(184,150,92,.3);outline:0;
 background:#161311;color:#f1e5ce;font-size:13px;
 box-shadow:0 8px 24px rgba(0,0,0,.18)
}
.searchbox input:focus{border-color:rgba(184,150,92,.75)}
.searchbox span{position:absolute;right:17px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:18px}

/* categories */
.nav{
 max-width:1120px;margin:13px auto 0;padding:0 18px;
 display:flex;gap:6px;overflow:auto;scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.nav button{
 white-space:nowrap;background:rgba(34,27,21,.72);border:1px solid rgba(184,150,92,.18);
 color:#958873;padding:8px 12px;border-radius:3px;font-size:10px;cursor:pointer;
}
.nav button.active,.nav button:hover{color:#ead6ae;border-color:rgba(184,150,92,.55);background:#33241a}

/* menu */
.menu{padding:8px 0 150px}
.section{margin:31px 0 0}
.section-title{
 display:flex;align-items:center;gap:13px;margin-bottom:11px
}
.section-title h2{
 margin:0;color:#dfc596;font:600 29px/1 "Cormorant Garamond",serif;
 white-space:nowrap
}
.section-title i{height:1px;background:linear-gradient(90deg,rgba(184,150,92,.55),transparent);flex:1}
.section-title small{font-size:9px;color:#756b5c;letter-spacing:.16em}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 12px}
.item{
 display:grid;grid-template-columns:74px 1fr auto;gap:11px;align-items:center;
 min-height:76px;padding:7px;border:1px solid rgba(255,255,255,.055);
 background:linear-gradient(90deg,rgba(55,39,27,.7),rgba(24,21,18,.82));
 transition:.18s
}
.item:hover{border-color:rgba(184,150,92,.32);transform:translateY(-1px)}
.pic{
 width:74px;height:62px;object-fit:cover;border-radius:2px;
 filter:saturate(.78) contrast(.98)
}
.name{font:600 20px/1.02 "Cormorant Garamond",serif;color:#eadcc1}
.cat{font-size:8px;color:#786e61;letter-spacing:.11em;text-transform:uppercase;margin-top:5px}
.price{font-size:14px;color:#e0c18a;white-space:nowrap;font-weight:600}
.price small{font-size:9px;color:#837767}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:5px;margin-top:5px}
.qty button{
 width:23px;height:23px;border:1px solid rgba(184,150,92,.3);background:#1b1713;color:#d8bd86;
 border-radius:2px;cursor:pointer
}
.qty span{font-size:10px;min-width:14px;text-align:center}
.add{
 border:1px solid rgba(184,150,92,.35);background:rgba(184,150,92,.08);color:#d8bd86;
 padding:5px 8px;border-radius:2px;font-size:9px;cursor:pointer
}
.variants{grid-column:2/-1;display:flex;gap:5px;margin-top:-3px}
.variants button{
 background:#171411;border:1px solid rgba(184,150,92,.22);color:#9b8d78;
 padding:5px 8px;border-radius:2px;font-size:9px;cursor:pointer
}
.variants button.active{color:#e6cc99;border-color:rgba(184,150,92,.6);background:#302217}
.noresult{text-align:center;padding:70px 10px;color:#8f8475}
.noresult b{display:block;font:600 36px "Cormorant Garamond";color:#d8bd86;margin-bottom:5px}

/* cart */
.cart{
 position:fixed;z-index:20;left:50%;bottom:15px;transform:translateX(-50%);
 width:min(700px,calc(100% - 24px));background:rgba(22,18,14,.97);
 border:1px solid rgba(184,150,92,.45);box-shadow:0 18px 60px #0009
}
.carthead{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.carthead b{font-size:12px}.carthead span{color:#d8bd86;font-size:13px}
.panel{display:none;border-top:1px solid rgba(184,150,92,.2);padding:12px}
.cart.open .panel{display:block}
.cartlist{max-height:210px;overflow:auto}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff0a;font-size:11px}
.crow strong{color:#d8bd86}.remove{border:0;background:none;color:#766d62;cursor:pointer}
.form{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.form input,.form select{
 background:#13110f;border:1px solid rgba(184,150,92,.25);color:#e9ddc5;padding:10px;border-radius:2px;outline:0
}
.order{
 grid-column:1/-1;border:0;background:#b8965c;color:#17110d;padding:11px;
 font-weight:600;cursor:pointer;border-radius:2px
}
.toast{
 position:fixed;z-index:30;bottom:94px;left:50%;transform:translateX(-50%);
 background:#2b2118;border:1px solid rgba(184,150,92,.45);color:#e1c994;
 padding:9px 14px;font-size:10px;opacity:0;transition:.2s
}
.toast.show{opacity:1}
@media(max-width:700px){
 .wrap{padding:0 12px}
 header{margin-top:10px;padding:23px 13px 18px}
 .grid{grid-template-columns:1fr}
 .item{grid-template-columns:68px 1fr auto}
 .pic{width:68px;height:58px}
 .name{font-size:20px}
 .section-title h2{font-size:27px}
 .form{grid-template-columns:1fr}
 .order{grid-column:auto}
}
</style>
</head>
<body>

</div>

const PHONE="919520951715";
let active="All", cart={}, variants={};

const aliases={
 "Noodles Veg & Non Veg":"noodles",
 "Momos":"momo momos",
 "Maggi":"maggi noodles",
 "Veg Main Course":"paneer dal veg",
 "Non Veg Main Course":"chicken non veg",
 "Rice / Biryani":"rice biryani",
 "Burger / Sandwich":"burger sandwich",
 "Tawa Roti / Tandoor Roti":"roti naan",
 "Desert":"dessert ice cream",
 "Drinks":"drink soda lassi"
};
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const slug=s=>norm(s).replace(/\s+/g,"-");

function allCats(){return ["All",...MENU.map(x=>x.category)]}
function itemText(x){return norm(x.name+" "+x.category+" "+(aliases[x.category]||""))}
function match(x,q){return !q || norm(q).split(/\s+/).every(w=>itemText(x).includes(w))}
function price(x){
 if(!x.variants)return x.price;
 let v=variants[slug(x.name)]||Object.keys(x.variants)[0];
 return x.variants[v]
}
function variant(x){return variants[slug(x.name)]||Object.keys(x.variants||{})[0]}

function renderNav(){
 nav.innerHTML="";
 allCats().forEach(c=>{
  let b=document.createElement("button");
  b.textContent=c;b.className=c===active?"active":"";
  b.onclick=()=>{active=c;search.value="";renderNav();render()};
  nav.appendChild(b)
 })
}

function render(){
 let q=norm(search.value), found=0;
 menu.innerHTML="";
 MENU.forEach(s=>{
  if(active!=="All"&&active!==s.category)return;
  let items=s.items.filter(x=>match({...x,category:s.category},q));
  if(!items.length)return;
  found+=items.length;
  let sec=document.createElement("section");sec.className="section";
  sec.innerHTML=`<div class="section-title"><h2>${s.category}</h2><i></i><small>${items.length} ITEMS</small></div>`;
  let grid=document.createElement("div");grid.className="grid";
  items.forEach(x=>grid.appendChild(card(x,s.category)));
  sec.appendChild(grid);menu.appendChild(sec);
 });
 if(!found)menu.innerHTML='<div class="noresult"><b>No dish found</b>Try noodles, chicken, paneer, momos...</div>'
}

function card(x,cat){
 let k=slug(x.name), v=variant(x), p=price(x);
 let key=x.variants?x.name+" • "+v:x.name, qty=cart[key]?.qty||0;
 let el=document.createElement("article");el.className="item";
 el.innerHTML=`
  <img class="pic" src="${x.image}" alt="${x.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
  <div>
   <div class="name">${x.name}</div>
   <div class="cat">${cat}</div>
   <div class="actions">
    <div class="qty"><button onclick='change(${JSON.stringify(key)},${p},-1)'>−</button><span>${qty}</span><button onclick='change(${JSON.stringify(key)},${p},1)'>+</button></div>
    <button class="add" onclick='change(${JSON.stringify(key)},${p},1)'>ADD</button>
   </div>
  </div>
  <div class="price">₹${p}</div>
  ${x.variants?`<div class="variants">${Object.keys(x.variants).map(z=>`<button class="${z===v?"active":""}" onclick='setVar(${JSON.stringify(x.name)},${JSON.stringify(z)})'>${z} ₹${x.variants[z]}</button>`).join("")}</div>`:""}
 `;
 return el
}

function setVar(name,v){variants[slug(name)]=v;render()}
function change(k,p,d){
 if(!cart[k])cart[k]={qty:0,price:p};
 cart[k].qty+=d;if(cart[k].qty<=0)delete cart[k];
 update();render();toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),800)
}
function update(){
 cartlist.innerHTML="";let total=0,count=0;
 Object.entries(cart).forEach(([k,x])=>{
  total+=x.qty*x.price;count+=x.qty;
  cartlist.innerHTML+=`<div class="crow"><div>${k}<br><small style="color:#71695f">Qty ${x.qty}</small></div><strong>₹${x.qty*x.price}</strong><button class="remove" onclick='del(${JSON.stringify(k)})'>×</button></div>`
 });
 if(!count)cartlist.innerHTML='<div style="color:#756d62;font-size:11px;padding:7px 0">Your order is empty.</div>';
 countEl.textContent=count+" item"+(count===1?"":"s");
 totalEl.textContent=total
}
function del(k){delete cart[k];update();render()}
function toggleCart(){cartEl.classList.toggle("open")}

function sendOrder(){
 let entries=Object.entries(cart),table=document.getElementById("table").value,note=document.getElementById("note").value.trim();
 if(!entries.length)return alert("Please add items first.");
 if(!table)return alert("Please select your table number.");
 let total=0,msg="THE TASTE RESTRO\n\nTABLE: "+table+"\n\nORDER:\n";
 entries.forEach(([k,x])=>{let a=x.qty*x.price;total+=a;msg+="• "+k+" × "+x.qty+" = ₹"+a+"\n"});
 msg+="\nTOTAL: ₹"+total;
 if(note)msg+="\nNOTE: "+note;
 window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg),"_blank")
}

const search=document.getElementById("search"),nav=document.getElementById("nav"),menu=document.getElementById("menu");
const cartEl=document.getElementById("cart"),cartlist=document.getElementById("cartlist"),countEl=document.getElementById("count"),totalEl=document.getElementById("total"),toast=document.getElementById("toast");
search.addEventListener("input",()=>{active="All";renderNav();render()});
renderNav();render();update();
</script>
